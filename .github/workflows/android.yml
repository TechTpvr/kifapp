name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npx capacitor-assets generate --iconPath logo-app.png || true

      - run: npm run build

      - run: npx cap add android

      - run: npx cap sync android

      - name: Decode Android keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kifnet-release.jks"

      - name: Configure Android release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          KIFNET_KEYSTORE_PATH: ${{ runner.temp }}/kifnet-release.jks
          KIFNET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KIFNET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KIFNET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 ../scripts/configure-android-signing.py

      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build debug APK when signing secrets are not configured
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kifnet-android
          path: android/app/build/outputs/apk/**/*.apk
