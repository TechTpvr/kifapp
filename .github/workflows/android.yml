name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  android:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Verify web build
        run: |
          test -f dist/index.html
          echo "Web build OK"

      - name: Install Capacitor Android
        run: npm install @capacitor/android@8 @capacitor/cli@8

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Generate app icons
        run: |
          npx capacitor-assets generate --iconPath logo-app.png || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Decode Android keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kifnet-release.jks"

      - name: Configure release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          KIFNET_KEYSTORE_PATH: ${{ runner.temp }}/kifnet-release.jks
          KIFNET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KIFNET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KIFNET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 ../scripts/configure-android-signing.py

      - name: Build Release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Debug APK
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kifnet-android
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
